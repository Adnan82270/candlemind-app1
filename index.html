const DEF={lang:"en",theme:"dark",pair:"EUR/USD",tf:60,exp:60,mode:"balanced",minStr:20,n:200,src:"live",maxDaily:50,vib:true,refresh:0,api:"",payout:85,autoLive:true};

let tab="an",last=null,msg="",zoom=80,timer=null;

/* ---- Data adapter. Only "demo" is implemented. Live adapter must be server-side (keys never in browser). ---- */
function hsh(x){x=Math.imul(x^x>>>15,2246822507);x=Math.imul(x^x>>>13,3266489909);return(x^x>>>16)>>>0}
function sh(s){let h=7;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}

 if(S.src!=="demo"){const c=CACHE[pair+tf];if(!c)throw new Error("No live data loaded");return c.slice(-n)}
 const end=Math.floor(Date.now()/1000/tf)-1,a=Math.floor(end/4000)*4000;let p=PAIRS[pair],out=[];
 for(let i=a;i<=end;i++){const o=p,r=ret(pair,tf,i),c=o+r,w=Math.abs(ret(pair,tf,i+99999))*.5;p=c;out.push({t:i*tf*1000,idx:i,o,h:Math.max(o,c)+w,l:Math.min(o,c)-w,c})}

 return out.slice(-n)}
const CACHE={},LIVE_TFS=[60,300,900];let META=null;
async function load(pair,tf,n,fresh){
 if(S.src==="demo")return getCandles(pair,tf,n);
 if(!LIVE_TFS.includes(tf))throw new Error("Unsupported timeframe for live provider ("+fmtT(tf)+"). Supported: 1m, 5m, 15m.");
 META=null;let j;try{j=await api("/api/candles?pair="+encodeURIComponent(pair)+"&tf="+tf+"&n="+Math.min(500,n)+(fresh?"&fresh=1":""))}catch(e){throw new Error("Data provider error: "+e.message)}
 const c=j.candles;if(!Array.isArray(c)||c.length<60)throw new Error("Provider returned too few candles");
 const IVN={60:"1min",300:"5min",900:"15min"};
 if(!j.provider||String(j.symbol).toUpperCase()!==pair||j.interval!==IVN[tf]||!(j.supportedIntervals||[]).includes(IVN[tf]))throw new Error("Provider response mismatch (symbol "+j.symbol+", interval "+j.interval+"); expected "+pair+" "+IVN[tf]);
 for(let i=0;i<c.length;i++){const x=c[i];if(![x.t,x.o,x.h,x.l,x.c].every(Number.isFinite)||x.h<Math.max(x.o,x.c)||x.l>Math.min(x.o,x.c))throw new Error("Invalid candle data");if(i&&x.t<=c[i-1].t)throw new Error("Candles out of order")}

async function evalLive(){let ch=0;const keys=[...new Set(H.filter(h=>h.src==="LIVE"&&!h.res&&h.dir!=="NO TRADE").map(h=>h.pair+"|"+h.tf))];
 for(const k of keys){const[p,tf]=k.split("|");let c;try{c=await load(p,+tf,300)}catch(e){continue}
  const m=new Map(c.map(x=>[x.t,x]));

 if(ch)saveH();return ch}
function paper(rows){const g={};for(const h of rows)if(h.res){const o=g[h.src]=g[h.src]||{c:0,i:0,t:0,u:0};h.res==="correct"?(o.c++,o.u+=(h.payout||85)/100):h.res==="incorrect"?(o.i++,o.u-=1):o.t++}
 return`<div class="card"><h2>Paper trading / forward test</h2><p class="mut">Every UP/DOWN signal is logged as a 1-unit paper trade. No real trades are placed. Sources are never mixed.</p><table><tr><th>Source</th><th>Trades</th><th>W/L/T</th><th>Net units</th></tr>${Object.entries(g).map(([s,o])=>`<tr><td>${s}${s==="LIVE"?" (forward test)":""}</td><td>${o.c+o.i+o.t}</td><td>${o.c}/${o.i}/${o.t}</td><td>${o.u.toFixed(2)}</td></tr>`).join("")||"<tr><td colspan=4 class=mut>No evaluated signals yet</td></tr>"}</table></div>`}
const ON_ART=()=>/claude\.ai|claudeusercontent|claude\.site/.test(location.hostname||"");

let busy=false,failAt=0,lastErr="",SJ=null;
function conn(){if(S.src==="demo")return["DEMO","#8b5cf6"];if(lastErr)return["OFFLINE","#ef4444"];if(!META||META.pair!==S.pair||META.tf!==S.tf)return["NO DATA","#ef4444"];return Date.now()-META.latest>3*S.tf*1000||Date.now()-META.at>3*S.tf*1000?["STALE","#f59e0b"]:["LIVE","#22c55e"]}
function liveTick(){if(S.src!=="live"||!S.autoLive||busy||document.hidden||S.exp%S.tf||!LIVE_TFS.includes(S.tf)||Date.now()-failAt<15000)return;
 const want=Math.floor((Date.now()-8000)/(S.tf*1000))-1;
 if(H.some(h=>h.pair===S.pair&&h.tf===S.tf&&h.exp===S.exp&&h.idx===want))return;analyze()}
let VO="";async function vfy(){VO="checking…";render();try{const j=await api("/api/verify?pair="+encodeURIComponent(S.pair)+"&tf="+S.tf);VO=JSON.stringify(j,null,1)}catch(e){VO="unreachable: "+e.message}render()}
let ST="";async function chk(){ST="checking…";render();try{const j=await api("/api/status");SJ=j;lastErr=j.configured?"":"Backend reachable but TWELVEDATA_API_KEY is not set on the server";ST=(j.configured?"connected · "+j.provider+" · last OK "+(j.lastOk||"never"):"reachable, PROVIDER KEY MISSING")}catch(e){ST="unreachable: "+e.message;lastErr=e.message}render()}
/* ---- Indicators ---- */
const ema=(a,p)=>{const k=2/(p+1);let e=a[0];return a.map(v=>e=v*k+e*(1-k))};
function wilder(a,p){let v=a.slice(0,p).reduce((x,y)=>x+y,0)/p;const o=[v];for(let i=p;i<a.length;i++){v=(v*(p-1)+a[i])/p;o.push(v)}return o}
function ind(c){
 const cl=c.map(x=>x.c),tr=[],pd=[],md=[];
 for(let i=1;i<c.length;i++){const u=c[i].h-c[i-1].h,d=c[i-1].l-c[i].l;tr.push(Math.max(c[i].h-c[i].l,Math.abs(c[i].h-c[i-1].c),Math.abs(c[i].l-c[i-1].c)));pd.push(u>d&&u>0?u:0);md.push(d>u&&d>0?d:0)}
 const A=wilder(tr,14),P=wilder(pd,14),M=wilder(md,14),dx=A.map((a,i)=>{const pi=100*P[i]/a,mi=100*M[i]/a;return 100*Math.abs(pi-mi)/(pi+mi||1)}),adx=wilder(dx,14).pop();
 const g=cl.slice(1).map((v,i)=>v-cl[i]);let ag=0,al=0;for(let i=0;i<14;i++){ag+=Math.max(g[i],0)/14;al+=Math.max(-g[i],0)/14}
 for(let i=14;i<g.length;i++){ag=(ag*13+Math.max(g[i],0))/14;al=(al*13+Math.max(-g[i],0))/14}
 const rsi=100-100/(1+ag/(al||1e-12)),e12=ema(cl,12),e26=ema(cl,26),ml=e12.map((v,i)=>v-e26[i]),sg=ema(ml,9),hist=ml.at(-1)-sg.at(-1);
 const w=cl.slice(-20),mean=w.reduce((x,y)=>x+y,0)/20,sd=Math.sqrt(w.reduce((x,y)=>x+(y-mean)**2,0)/20),up=mean+2*sd,lo=mean-2*sd;
 const hh=Math.max(...c.slice(-14).map(x=>x.h)),ll=Math.min(...c.slice(-14).map(x=>x.l));
 return{e9:ema(cl,9).at(-1),e21:ema(cl,21).at(-1),e50:ema(cl,50).at(-1),atr:A.at(-1),adx,rsi,hist,up,lo,pb:(cl.at(-1)-lo)/((up-lo)||1e-12),k:100*(cl.at(-1)-ll)/((hh-ll)||1e-12),bbw:(up-lo)/mean,price:cl.at(-1)}}
/* ---- Rule-based engine: correlated indicators grouped into 3 families, weighted by regime (not one vote each). ---- */
function signal(c){
 if(c.length<60)return{dir:"NO",why:"Need at least 60 candles"};
 const I=ind(c),A=I.atr||1e-9,th=Math.tanh;
 const trend=th(((I.e9-I.e21)+(I.e21-I.e50))/(A*1.5)),mom=th(I.hist/(A*.25))*.6+th((I.rsi-50)/18)*.4,mr=-th((I.pb-.5)*3)*.5-th((I.k-50)/30)*.5;
 const tr=I.adx>=22,w=tr?[.5,.3,.2]:[.15,.25,.6],rc=c.slice(-100,-1);
 const swH=rc.filter((x,i)=>i>1&&i<rc.length-2&&x.h>=Math.max(rc[i-1].h,rc[i-2].h,rc[i+1].h,rc[i+2].h)).map(x=>x.h),swL=rc.filter((x,i)=>i>1&&i<rc.length-2&&x.l<=Math.min(rc[i-1].l,rc[i-2].l,rc[i+1].l,rc[i+2].l)).map(x=>x.l);
 const px=I.price,res=swH.filter(v=>v>px).sort((a,b)=>a-b)[0],sup=swL.filter(v=>v<px).sort((a,b)=>b-a)[0],nearR=res!==undefined&&res-px<.5*A,nearS=sup!==undefined&&px-sup<.5*A;
 const l1=c.at(-1),p1=c.at(-2),bull=l1.c>l1.o&&p1.c<p1.o&&l1.c>=p1.o&&l1.o<=p1.c,bear=l1.c<l1.o&&p1.c>p1.o&&l1.c<=p1.o&&l1.o>=p1.c,pa=bull?1:bear?-1:0;
 let score=w[0]*trend+w[1]*mom+w[2]*mr+.1*pa;if(nearR&&score>0)score*=.5;if(nearS&&score<0)score*=.5;const str=Math.abs(score)*100;
 const thr=Math.max({conservative:35,balanced:22,aggressive:12}[S.mode],S.minStr),R={I,score,str,trend,mom,mr,res,sup,pa,nearR,nearS,regime:tr?"Trending":"Ranging"};
 if(tr&&Math.sign(trend)!==Math.sign(mom)&&Math.min(Math.abs(trend),Math.abs(mom))>.3)return{...R,dir:"NO",why:"Conflicting trend and momentum"};
 if(I.adx<12&&S.mode!=="aggressive")return{...R,dir:"NO",why:"Consolidation (ADX below 12)"};
 if(str<thr)return{...R,dir:"NO",why:"Signal strength "+str.toFixed(0)+"% below threshold "+thr+"%"};

/* ---- Analyze ---- */
const kexp=()=>Math.max(1,Math.round(S.exp/S.tf));
function analyze(){
 if(busy)return;busy=true;const b=$("#go")||{classList:{add(){},remove(){}}};b.classList.add("busy");msg="";
 setTimeout(async()=>{try{if(S.exp%S.tf)throw new Error("Expiry "+fmtT(S.exp)+" is not a multiple of the "+fmtT(S.tf)+" candle, so the outcome cannot be measured. Choose an expiry that is a multiple of the candle timeframe.");await load(S.pair,S.tf,Math.max(60,S.n),true);
  const today=new Date().toDateString(),cnt=H.filter(h=>new Date(h.ts).toDateString()===today).length;
  if(cnt>=S.maxDaily)throw new Error("Daily analysis limit reached ("+S.maxDaily+").");
  const c=getCandles(S.pair,S.tf,Math.max(60,S.n)),lc=c.at(-1);
  if(Date.now()-lc.t>S.tf*1000*3)throw new Error("STALE: latest candle too old.");
  const r=signal(c);r.price=lc.c;r.t=lc.t;r.idx=lc.idx;r.meta=S.src==="demo"?{provider:"SIMULATED demo",symbol:S.pair,interval:fmtT(S.tf)}:META;last=r;
  const dup=H.find(h=>h.pair===S.pair&&h.tf===S.tf&&h.exp===S.exp&&h.idx===lc.idx);if(dup){msg="Candle already analyzed. Next candle in ~"+Math.max(0,Math.ceil((lc.t+2*S.tf*1000-Date.now())/1000))+"s.";b.classList.remove("busy");busy=false;render();return}
  H.unshift({ts:Date.now(),pair:S.pair,tf:S.tf,exp:S.exp,dir:r.dir==="NO"?"NO TRADE":r.dir,price:lc.c,id:S.pair+"|"+S.tf+"|"+S.exp+"|"+lc.idx,idx:lc.idx,t:lc.t,k:kexp(),payout:S.payout,src:S.src==="demo"?"DEMO (simulated)":"LIVE",model:"rules-v0.1 (uncalibrated)",res:null});
  H=H.slice(0,300);saveH();if(S.vib&&navigator.vibrate)navigator.vibrate(r.dir==="NO"?40:[60,40,60]);
 }catch(e){last={dir:"NA",why:e.message};failAt=Date.now();lastErr=e.message}
 b.classList.remove("busy");busy=false;render()},500)}
function evalHist(){let ch=0;const nowIdx=h=>Math.floor(Date.now()/1000/h.tf)-1;
 for(const h of H){if(h.res||h.dir==="NO TRADE"||h.src==="LIVE")continue;if(nowIdx(h)<h.idx+h.k)continue;
  let d=0;for(let i=h.idx+1;i<=h.idx+h.k;i++)d+=ret(h.pair,h.tf,i);
  h.res=Math.abs(d)<1e-12?"tie":((d>0)===(h.dir==="UP")?"correct":"incorrect");ch=1}
 if(ch)saveH()}
/* ---- Backtest (walk-forward; no future data in each signal) ---- */
let BT=null;
async function backtest(){
 try{if(S.exp%S.tf)throw new Error("Expiry is not a multiple of the candle timeframe");const N=+$("#btn").value,k=kexp(),pay=+$("#bpay").value/100;
  const c=await load(S.pair,S.tf,Math.min(N,S.src==="demo"?3500:500)),rows=[];let cor=0,inc=0,tie=0,nt=0,eq=0,pk=0,dd=0;const bins={};
  for(let i=59;i<c.length-k;i++){const s=signal(c.slice(Math.max(0,i-199),i+1));
   if(s.dir==="NO"){nt++;continue}
   const d=c[i+k].c-c[i].c,res=Math.abs(d)<1e-12?"tie":((d>0)===(s.dir==="UP")?"correct":"incorrect");
   if(res==="correct"){cor++;eq+=pay}else if(res==="incorrect"){inc++;eq-=1}else tie++;
   pk=Math.max(pk,eq);dd=Math.max(dd,pk-eq);const b=Math.min(4,Math.floor(s.str/20));bins[b]=bins[b]||[0,0];bins[b][1]++;if(res==="correct")bins[b][0]++;
   rows.push([new Date(c[i].t).toISOString(),S.pair,fmtT(S.tf),fmtT(S.exp),s.dir,s.str.toFixed(1),c[i].c.toFixed(5),c[i+k].c.toFixed(5),res])}
  BT={cor,inc,tie,nt,rows,eq,dd,pay,bins,k,N:c.length}}catch(e){BT={err:e.message}}render()}
function csv(){const r=[["time","pair","tf","expiry","pred","strength","entry","exit","result"],...BT.rows];

/* ---- Chart ---- */

 const dpr=devicePixelRatio||1,W=cv.clientWidth,Hh=cv.clientHeight;cv.width=W*dpr;cv.height=Hh*dpr;const g=cv.getContext("2d");g.scale(dpr,dpr);
